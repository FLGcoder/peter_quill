<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Star Lord</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
     integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
     <link rel="stylesheet" href="styles/style.css">

</head>
<body id = "body-login">
   <div class="container h-100 d-flex align-items-center justify-content-center">
    <form class="login-box text-center p-4">

        <img src="assets/images/Star-Lord-Logo.png" alt="Star Lord Logo" class="logo mb-3">

        <h1 class="h4 mb-3 fw-bold text-light">Login</h1> 

        <div class="form-floating mb-3">
            <input type="email" class="form-control custom-input" id="floatingInput" placeholder="name@example.com"> 
            <label for="floatingInput">Email</label> 
        </div> 

        <div class="form-floating mb-3"> 
            <input type="password" class="form-control custom-input" id="floatingPassword" placeholder="Password"> 
            <label for="floatingPassword">Senha</label> 
        </div> 

        <div class="form-check text-start my-3 text-light"> 
            <input class="form-check-input" type="checkbox" id="checkDefault"> 
            <label class="form-check-label" for="checkDefault">
                Lembrar de mim
            </label>
        </div> 

        <button class="btn btn-login w-100 py-2" type="submit">Entrar</button>

    </form>
</div>
    
</body>
</html>
